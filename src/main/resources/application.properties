# Spring Boot Application Configuration
spring.application.name=movie-watchlist-711189

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:watchlistdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.student711189.moviewatchlist=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# External API Configuration (Placeholder values - DO NOT COMMIT REAL KEYS)
omdb.api.key=f17de943
omdb.api.url=http://www.omdbapi.com/

tmdb.api.key=48f29c977a517bb2f570de5bb6473827
tmdb.api.url=https://api.themoviedb.org/3

# Application Configuration
app.images.directory=images
app.max.images.per.movie=3

# JSON Configuration
spring.jackson.serialization.indent-output=true 