# Test Configuration
spring.application.name=movie-watchlist-711189-test

# H2 Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable H2 console in tests
spring.h2.console.enabled=false

# Test API Configuration (dummy values)
omdb.api.key=test-omdb-key
tmdb.api.key=test-tmdb-key

# Test logging
logging.level.com.student711189.moviewatchlist=DEBUG
logging.level.org.springframework.web=INFO

# Test images directory
app.images.directory=test-images 